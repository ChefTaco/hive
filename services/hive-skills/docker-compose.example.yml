services:
  skills:
    image: ${HIVE_SKILLS_IMAGE:-ghcr.io/cheftaco/hive-skills:1.2.0}
    ports:
      - "127.0.0.1:4030:4030"
    environment:
      HIVE_SKILLS_HOST: 0.0.0.0
      HIVE_SKILLS_PORT: 4030
      HIVE_SKILLS_PUBLIC_URL: ${HIVE_SKILLS_PUBLIC_URL:?set the public HTTPS URL}
      HIVE_SKILLS_DATA_DIR: /data/skills
      HIVE_SKILLS_SESSION_SECRET: ${HIVE_SKILLS_SESSION_SECRET:?set a random session secret}
      HIVE_SKILLS_ADMIN_USERS: ${HIVE_SKILLS_ADMIN_USERS:?configure the container PAM administrators}
      HIVE_SKILLS_TLS_KEY_FILE: /run/certs/server.key
      HIVE_SKILLS_TLS_CERT_FILE: /run/certs/server.crt
      HIVE_AUTO_MIGRATE: ${HIVE_AUTO_MIGRATE:-true}
      HIVE_UPDATE_CHECK: ${HIVE_UPDATE_CHECK:-false}
      HIVE_AUTO_UPGRADE: "false"
    volumes:
      - skills-data:/data
      - ${HIVE_SKILLS_TLS_DIRECTORY:?set the TLS directory}:/run/certs:ro
    restart: unless-stopped
volumes:
  skills-data:
