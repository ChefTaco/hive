services:
  hive-router:
    build:
      context: ../..
      dockerfile: services/hive-router/Dockerfile
    image: hive-router:local
    ports:
      - "127.0.0.1:${HIVE_ROUTER_API_PORT:-4020}:4020"
      - "127.0.0.1:${HIVE_ROUTER_ADMIN_PORT:-9443}:9443"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      API_PORT: 4020
      ADMIN_PORT: 9443
      DATABASE_URL: file:/app/data/router.db
      DATA_DIR: /app/data
      TRACE_DIR: /app/data/traces
      HIVE_ROUTER_SECRET: ${HIVE_ROUTER_SECRET:?set a random secret of at least 32 characters}
      HIVE_ROUTER_ADMIN_USERS: ${HIVE_ROUTER_ADMIN_USERS:?set the exact PAM users allowed to sign in}
      REQUIRE_TLS: "true"
      TLS_CERT_PATH: /run/certs/server.crt
      TLS_KEY_PATH: /run/certs/server.key
    volumes:
      - ./data:/app/data
      - ${HIVE_ROUTER_TLS_CERT_PATH:?set the TLS certificate path}:/run/certs/server.crt:ro
      - ${HIVE_ROUTER_TLS_KEY_PATH:?set the TLS private-key path}:/run/certs/server.key:ro
