services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: hivemem-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST — localhost by default
      - "127.0.0.1:6334:6334"   # gRPC — localhost by default
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 512M

  hivemem-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hivemem-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HIVEMEM_PORT:-18790}:${HIVEMEM_PORT:-18790}"
    volumes:
      - ${HIVEMEM_STORAGE_PATH:-/var/opt/hivemem}:${HIVEMEM_STORAGE_PATH:-/var/opt/hivemem}
    env_file:
      - ../.env
    environment:
      - HIVEMEM_QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    profiles:
      - full   # Use `docker compose --profile full up` to also start the TypeScript API container.
               # For dev, run `npm --prefix ts-core run dev` and only start qdrant here.

volumes:
  qdrant_data:
    driver: local
