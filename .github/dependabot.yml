version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /services/hive-router
      - /services/hive-iam
      - /services/hive-iam/apps/iam-core
      - /services/hive-iam/packages/iam-sdk
      - /services/hive-mem
      - /services/hive-mem/ts-core
      - /services/hive-mem/sdks/typescript
      - /services/hive-skills
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node.js runtime major (see .nvmrc); bump it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
