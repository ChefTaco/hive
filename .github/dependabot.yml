version: 2
updates:
  - package-ecosystem: gomod
    directory: /deployment/caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ingress-go-patches:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /services/hive-registry
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The reviewed compiler is pinned exactly; change it through an explicit compatibility review.
      - dependency-name: "typescript"
      # @types/node tracks the Node.js runtime major (see .nvmrc); bump it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Suite packages first: every @hivemagnus/* update lands in one grouped pull request.
      hivemagnus:
        patterns:
          - "@hivemagnus/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Digest-pinned Dockerfile bases: the ingress (golang, caddy), the Node.js runtime image and the
  # Hive Registry builder. The datastore Dockerfiles take their bases from deployment/images.json
  # build arguments, which change through a reviewed datastore profile. A changed base reaches
  # users only in a new image version (deployment/images.json) and a signed release.
  - package-ecosystem: docker
    directories:
      - /deployment
      - /deployment/runtime
      - /services/hive-registry
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Node.js major follows the runtime (.nvmrc and hive-node-runtime); change it deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-bases:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
