version: 2
updates:
  - package-ecosystem: gomod
    directory: /deployment/caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ingress-go-patches:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /services/hive-registry
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node.js runtime major (see .nvmrc); bump it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
