name: Published image re-scan

# Re-scans every image the newest published suite release pins, daily, with a fresh Trivy
# vulnerability database, so an advisory published after the release is found without waiting
# for the next release. HIGH/CRITICAL findings (the release policy, unfixed included) open or
# update one issue per release and fail the run. See docs/RELEASING.md.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: Suite release to scan (X.Y.Z); empty for the newest published release
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: image-rescan
  cancel-in-progress: false

jobs:
  rescan:
    name: Re-scan the newest published release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release }}
        run: |
          version=$REQUESTED
          if [[ -z "$version" ]]; then
            version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq 'select(.draft==false and .prerelease==false) | .tag_name | ltrimstr("v")')
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && -f "releases/$version.json" ]] || { echo "::error::No signed manifest for release '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Scan with a fresh vulnerability database
        id: scan
        env:
          HIVE_IMAGE_SECURITY_MODE: all
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          export TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
          rm -rf -- "$TRIVY_CACHE_DIR"
          set +e
          bash scripts/release/scan-suite-images.sh "releases/$VERSION.json" image-security-reports 2>&1 | tee scan.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-rescan-${{ steps.release.outputs.version }}
          path: image-security-reports
          if-no-files-found: ignore
      - name: Report findings in an issue
        if: steps.scan.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Published image re-scan: HIGH/CRITICAL findings in suite $VERSION"
          {
            printf 'The daily re-scan of the images pinned by `releases/%s.json` found HIGH or CRITICAL\n' "$VERSION"
            printf 'vulnerabilities with a fresh Trivy database (policy: all, unfixed included).\n\n'
            printf 'Run: %s (the reports are attached to the run).\n\n```\n' "$RUN_URL"
            { grep -E 'linux/(amd64|arm64)|HIGH or CRITICAL|Error|error' scan.log || true; } | tail -n 80
            printf '```\n\nTriage: fix in a new image version and release, or record a reviewed, expiring exception in `deployment/trivy/`.\n'
          } > issue.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title | jq -r --arg title "$title" 'map(select(.title==$title))[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue.md
          fi
          exit 1
