name: Release upgrade round trip

# Installs a published signed release with its own tagged controller, upgrades it to a newer one
# with that release's controller (--allow-migrations), runs post-upgrade and doctor, and rolls
# back (scripts/suite/release-upgrade-roundtrip.sh). It pulls the published images, so it runs
# weekly, when a release is published, by hand, and on pull requests that change the round trip.
on:
  schedule:
    - cron: '20 4 * * 1'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      from:
        description: Release to install (default the one before the newest)
        required: false
      to:
        description: Release to upgrade to (default the newest)
        required: false
  pull_request:
    paths:
      - scripts/suite/release-upgrade-roundtrip.sh
      - .github/workflows/release-upgrade.yml

permissions:
  contents: read

concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pair:
    runs-on: ubuntu-24.04
    outputs:
      from: ${{ steps.pair.outputs.from }}
      to: ${{ steps.pair.outputs.to }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pair
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          # The two newest tagged signed releases in releases/, skipping those the newest manifest
          # withdraws and those tagged but never published (3.2.1, 3.12.8).
          all=$(find releases -maxdepth 1 -name '[0-9]*.[0-9]*.[0-9]*.json' ! -name '*.inputs.json' -printf '%f\n' | sed 's/\.json$//' | sort -V)
          skip=$( { jq -r '(.withdrawn // [])[].version' "releases/$(tail -n 1 <<< "$all").json"; printf '3.2.1\n3.12.8\n'; } )
          # Only tagged ones: a release commit lands before its tag.
          mapfile -t releases < <(grep -vxF -f <(printf '%s\n' "$skip") <<< "$all" | while read -r version; do git rev-parse -q --verify "refs/tags/v$version" >/dev/null && printf '%s\n' "$version"; done)
          to=${TO:-${releases[-1]}}
          from=${FROM:-${releases[-2]}}
          [[ "$from" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$to" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release pair $from -> $to" >&2; exit 1; }
          echo "from=$from" >> "$GITHUB_OUTPUT"; echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "Round trip: $from -> $to" >> "$GITHUB_STEP_SUMMARY"

  round-trip:
    needs: pair
    name: ${{ matrix.profile }} ${{ needs.pair.outputs.from }} -> ${{ needs.pair.outputs.to }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure bounded authenticated package downloads
        run: sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - name: Install controller tools
        timeout-minutes: 20
        run: sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-install.sh jq openssl
      - name: Round trip
        env:
          FROM: ${{ needs.pair.outputs.from }}
          TO: ${{ needs.pair.outputs.to }}
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/suite/release-upgrade-roundtrip.sh --profile "$PROFILE" --from "$FROM" --to "$TO" --output "$RUNNER_TEMP/round-trip"
      - name: Steps
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/round-trip/steps.log" ]]; then { echo '```'; cat "$RUNNER_TEMP/round-trip/steps.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Command logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/round-trip/*.log; do echo "::group::${log##*/}"; tail -n 200 "$log"; echo '::endgroup::'; done
