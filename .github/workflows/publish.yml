name: Publish to npm

# Publishes every @hivemagnus package whose version is not on npm yet, with provenance, then the
# server images (linux/amd64 and linux/arm64) to GitHub Container Registry.
# - Push a tag vX.Y.Z (matching the launcher version) to publish.
# - Run it by hand (Actions > Publish to npm > Run workflow) for a dry run.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC). No npm token is stored.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install repository check tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&b<5)) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Check the tag matches the launcher version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/hive/package.json').version")"
          if [ "$version" != "$tag" ]; then echo "::error::launcher is $version, tag is v$tag"; exit 1; fi

      - name: Install dependencies
        run: |
          for dir in packages/hive-release services/hive-router services/hive-iam services/hive-mem/ts-core services/hive-mem/sdks/typescript services/hive-skills packages/hive; do
            (cd "$dir" && npm ci)
          done

      - name: Gates
        run: |
          npm run scan:secrets
          npm run check:private
          npm run audit:production
          npm run typecheck
          npm run build
          npm run test
          npm --prefix services/hive-mem/sdks/typescript run build
          npm --prefix services/hive-mem/sdks/typescript test
          npm run check:packs
          npm run check:skills-install
          npm run check:npm12
          npm run check:upgrades

      - name: Publish
        run: |
          # Order: libraries, then servers, then the launcher that installs them.
          for dir in services/hive-mem/sdks/typescript services/hive-iam/packages/iam-sdk services/hive-mem/ts-core services/hive-router services/hive-iam/apps/iam-core services/hive-skills packages/hive; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$dir" && npm publish --dry-run --ignore-scripts --access public)
            else
              # Already built and tested above, so skip the package lifecycle scripts.
              (cd "$dir" && npm publish --provenance --ignore-scripts --access public)
            fi
          done

  registry-ready:
    name: Verify public npm bundle availability
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Wait for registry metadata and verified tarballs
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: node scripts/wait-published-release.mjs

  images:
    name: Publish server image (${{ matrix.component }})
    needs: [publish, registry-ready]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [hive-iam-server, hive-router, hivemem-server, hive-skills]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      IMAGE: ghcr.io/cheftaco/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Exact release and immutable tag
        id: meta
        run: |
          version="$(node -p "require('./packages/hive/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          exists=false
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then exists=true; fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Prepare dry-run npm artifacts
        if: env.DRY_RUN == 'true'
        run: |
          npm run bootstrap
          npm run build
          for dir in packages/hive services/hive-router services/hive-iam/apps/iam-core services/hive-mem/ts-core services/hive-skills; do
            (cd "$dir" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/docker")
          done
      - name: Build and execute each architecture before publication
        if: steps.meta.outputs.exists == 'false'
        run: |
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" -f docker/server.Dockerfile \
              --build-arg "HIVE_PACKAGE=@hivemagnus/${{ matrix.component }}" \
              --build-arg "HIVE_VERSION=${{ steps.meta.outputs.version }}" -t "hive-image-check:$arch" docker
            docker run --rm --platform "linux/$arch" "hive-image-check:$arch" --version
            docker run --rm --platform "linux/$arch" "hive-image-check:$arch" env-schema
          done
      - uses: docker/login-action@v4
        if: env.DRY_RUN != 'true' && steps.meta.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image with provenance and SBOM
        id: build
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            HIVE_PACKAGE=@hivemagnus/${{ matrix.component }}
            HIVE_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true' && steps.meta.outputs.exists == 'false'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-images:
    name: Promote tested same-major image channels
    needs: [publish, images]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only after every immutable image passed
        run: |
          version="$(node -p "require('./packages/hive/package.json').version")"
          IFS=. read -r major minor patch <<< "$version"
          for name in hive-iam-server hive-router hivemem-server hive-skills; do
            image="ghcr.io/cheftaco/$name"
            docker buildx imagetools create --tag "$image:$major.$minor" --tag "$image:$major" "$image:$version"
          done
