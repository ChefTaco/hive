name: Publish to npm

# Publishes every @hivemagnus package whose version is not on npm yet, with provenance, then the
# hive-iam-server Docker image (linux/amd64 and linux/arm64) to GitHub Container Registry.
# - Push a tag vX.Y.Z (matching every package version) to publish.
# - Run it by hand (Actions > Publish to npm > Run workflow) for a dry run.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC). No npm token is stored.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install repository check tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&b<5)) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Check the tag matches every package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dir in services/hive-mem/sdks/typescript services/hive-iam/packages/iam-sdk services/hive-mem/ts-core services/hive-router services/hive-iam/apps/iam-core packages/hive; do
            version="$(node -p "require('./$dir/package.json').version")"
            if [ "$version" != "$tag" ]; then echo "::error::$dir is $version, tag is v$tag"; exit 1; fi
          done

      - name: Install dependencies
        run: |
          for dir in services/hive-router services/hive-iam services/hive-mem/ts-core services/hive-mem/sdks/typescript services/hive-skills packages/hive; do
            (cd "$dir" && npm ci)
          done

      - name: Gates
        run: |
          npm run scan:secrets
          npm run check:private
          npm run audit:production
          npm run typecheck
          npm run build
          npm run test
          npm --prefix services/hive-mem/sdks/typescript run build
          npm --prefix services/hive-mem/sdks/typescript test
          npm run check:packs
          npm run check:npm12

      - name: Publish
        run: |
          # Order: libraries, then servers, then the launcher that installs them.
          for dir in services/hive-mem/sdks/typescript services/hive-iam/packages/iam-sdk services/hive-mem/ts-core services/hive-router services/hive-iam/apps/iam-core packages/hive; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$dir" && npm publish --dry-run --ignore-scripts --access public)
            else
              # Already built and tested above, so skip the package lifecycle scripts.
              (cd "$dir" && npm publish --provenance --ignore-scripts --access public)
            fi
          done

  docker:
    name: Publish the IAM Docker image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      IMAGE: ghcr.io/cheftaco/hive-iam-server
      CONTEXT: services/hive-iam/apps/iam-core
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Image tags
        id: meta
        run: |
          version="$(node -p "require('./$CONTEXT/package.json').version")"
          # A manual (non-dry) run may only publish the image of a released version, built
          # from the same IAM sources as its tag.
          if [ "$DRY_RUN" != "true" ] && ! git diff --quiet "v$version" HEAD -- "$CONTEXT"; then
            echo "::error::$CONTEXT differs from tag v$version; release a new version instead"; exit 1
          fi
          tags="$IMAGE:$version"
          if [[ "$version" != *-* ]]; then
            IFS=. read -r major minor _ <<< "$version"
            tags+=",$IMAGE:$major.$minor,$IMAGE:$major,$IMAGE:latest"
          fi
          exists=false
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version is already published; skipping"
            exists=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        if: steps.meta.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        if: steps.meta.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: true
          tags: hive-iam-server:local
          cache-from: type=gha,scope=hive-iam
          cache-to: type=gha,mode=max,scope=hive-iam

      - name: Run the Compose example against it
        if: steps.meta.outputs.exists == 'false'
        run: bash scripts/check-iam-compose.sh --no-build

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.exists == 'false' && env.DRY_RUN != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 and linux/arm64${{ env.DRY_RUN != 'true' && ' and push' || '' }}
        id: build
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=hive-iam-server
            org.opencontainers.image.description=Hive IAM server: OAuth 2.0 / OpenID Connect identity service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/main/${{ env.CONTEXT }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=hive-iam

      - name: Attest the image
        if: steps.meta.outputs.exists == 'false' && env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
