name: Suite release

# Hive suite releases (2.0.0 and later), installed by hive.sh from a signed manifest.
# The v1.x tags belong to the retired npm 1.x line and never trigger this workflow; nothing here
# publishes to npm.
# 1. Run by hand from main: builds, executes and publishes the suite images listed in
#    deployment/images.json (the Hive Registry, the ingress and the hardened datastores), each
#    at its own exact version, for linux/amd64 and linux/arm64 with provenance, an SBOM and an
#    attestation. An existing tag is never rebuilt: a changed image takes a new version.
# 2. Offline: build releases/VERSION.json from the published digests, sign it, commit it.
# 3. Push the tag vVERSION: verifies the signed manifest against the tagged controller and
#    every published image tag it was built from, then publishes the GitHub release.
#    See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to publish from deployment/images.json (NAME:VERSION), or all"
        required: true
        type: string
        default: all
      dry_run:
        description: Build and execute only; publish nothing
        type: boolean
        default: true
  push:
    tags: ['v*', '!v0.*', '!v1.*']

permissions:
  contents: read

concurrency:
  group: suite-release
  cancel-in-progress: false

jobs:
  plan:
    name: Select suite images
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      native_matrix: ${{ steps.select.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Select from deployment/images.json
        id: select
        env:
          SELECTED: ${{ inputs.image }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then echo "::error::Publish suite images from main"; exit 1; fi
          matrix=$(jq -c --arg selected "$SELECTED" '
            [.images[] | select($selected=="all" or ($selected==(.image+":"+.version)))
             | select(.version|test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?(-[0-9]+)?$"))
             | . + {check: (.check|join(" ")), buildArgs: ((.buildArgs // {})|to_entries|map(.key+"="+.value)|join("\n"))}]' deployment/images.json)
          [[ $(jq length <<< "$matrix") -gt 0 ]] || { echo "::error::No image in deployment/images.json matches $SELECTED"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          native_matrix=$(jq -c '[.[] as $image | [{arch:"amd64",runner:"ubuntu-24.04"},{arch:"arm64",runner:"ubuntu-24.04-arm"}][] | $image + .]' <<< "$matrix")
          echo "native_matrix=$native_matrix" >> "$GITHUB_OUTPUT"

  native:
    name: Validate ${{ matrix.image }}:${{ matrix.version }} (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native_matrix) }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/cheftaco/${{ matrix.image }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable tag
        id: meta
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build on the matching architecture
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: suite-image-check:${{ matrix.arch }}
          build-args: ${{ matrix.buildArgs }}
          cache-from: type=gha,scope=suite-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=suite-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.arch }}
      - name: Execute runtime, recovery and security checks
        if: steps.meta.outputs.exists == 'false'
        env:
          BUILD_ARGS: ${{ matrix.buildArgs }}
          UPGRADE_FROM: ${{ matrix.upgradeFrom }}
        run: |
          arch="${{ matrix.arch }}"
          docker run --rm --platform "linux/$arch" --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true --entrypoint "$(cut -d' ' -f1 <<< '${{ matrix.check }}')" "suite-image-check:$arch" $(cut -s -d' ' -f2- <<< '${{ matrix.check }}')
          if [[ '${{ matrix.image }}' == hive-node-runtime ]]; then
            node scripts/release/check-node-runtime.mjs --image "suite-image-check:$arch" --platform "linux/$arch"
          fi
          if [[ '${{ matrix.image }}' == hive-postgres ]]; then
            baseline=; major=; version=
            while IFS= read -r line; do
              case "$line" in POSTGRES_IMAGE=*) baseline=${line#POSTGRES_IMAGE=};; POSTGRES_MAJOR=*) major=${line#POSTGRES_MAJOR=};; POSTGRES_VERSION=*) version=${line#POSTGRES_VERSION=};; esac
            done <<< "$BUILD_ARGS"
            [[ -n "$baseline" && -n "$major" && -n "$version" ]] || { echo '::error::PostgreSQL recovery inputs are missing'; exit 1; }
            # A minor update also starts the previously published image's data directly.
            previous=(); [[ -z "$UPGRADE_FROM" ]] || previous=(--previous "$UPGRADE_FROM")
            python3 scripts/release/check-postgres-runtime.py --platform "linux/$arch" --major "$major" --version "$version" --baseline "$baseline" --candidate "suite-image-check:$arch" "${previous[@]}"
          fi
          # New runtime images must also clear unfixed findings. Existing scoped
          # upstream-SBOM exceptions remain visible and independently reviewed.
          ignore=(); [[ ! -f "deployment/trivy/${{ matrix.image }}.trivyignore.yaml" ]] || ignore=(--ignorefile "/ignore/${{ matrix.image }}.trivyignore.yaml")
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/deployment/trivy:/ignore:ro" \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --image-src docker --platform "linux/$arch" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "${ignore[@]}" "suite-image-check:$arch"


  images:
    name: Publish ${{ matrix.image }}:${{ matrix.version }}
    needs: [plan, native]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      IMAGE: ghcr.io/cheftaco/${{ matrix.image }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable tag
        id: meta
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' 2>/dev/null); then
            echo "::notice::$IMAGE:$VERSION already exists ($digest); it is never rebuilt"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION@${digest//\"/} (existing)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish immutable image with provenance and SBOM
        id: build
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: ${{ matrix.buildArgs }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: |
            type=gha,scope=suite-${{ matrix.image }}-${{ matrix.version }}-amd64
            type=gha,scope=suite-${{ matrix.image }}-${{ matrix.version }}-arm64
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true' && steps.meta.outputs.exists == 'false'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        if: env.DRY_RUN != 'true' && steps.meta.outputs.exists == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  recovery:
    if: github.event_name == 'push'
    uses: ./.github/workflows/recovery.yml
    with:
      full: true

  release:
    name: Verify and publish the signed release
    needs: recovery
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the signed manifest against this controller
        run: bash scripts/release/check-suite-release.sh "${GITHUB_REF_NAME#v}" --registry
      - name: Require every published image tag the manifest was built from
        run: |
          version="${GITHUB_REF_NAME#v}"
          while read -r component tag; do
            published=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
            pinned=$(jq -r --arg name "$component" 'if $name=="chat-migrator" then .components.chattermost.initialization.image else .components[$name].image end' "releases/$version.json")
            [[ "$pinned" == "${tag%:*}@$published" ]] || { echo "::error::$component pins $pinned, but $tag is $published"; exit 1; }
            echo "$component: $tag = $published"
          done < <(jq -r '.products|to_entries[]|"\(.key) \(.value.image)"' "releases/$version.inputs.json")
      - name: Require the full release security policy
        env:
          HIVE_IMAGE_SECURITY_MODE: all
        run: bash scripts/release/scan-suite-images.sh "releases/${GITHUB_REF_NAME#v}.json" image-security-reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-image-security
          path: image-security-reports
          if-no-files-found: ignore
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "::error::Release $GITHUB_REF_NAME already exists"; exit 1; fi
          {
            awk -v heading="## $version" -v bracketed="## [$version]" '$0==heading || index($0, heading " ")==1 || index($0, bracketed)==1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md
            printf '\n## Install\n\n```bash\ngit clone --branch %s https://github.com/%s.git hive && cd hive\n./hive.sh --release %s\n```\n\n' "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$version"
            printf 'The manifest, its signature and the publisher key are attached and also in the tagged tree.\n\n'
            printf -- '- Publisher key fingerprint (SHA-256 of the DER public key): `%s`\n' "$(openssl pkey -pubin -in trust/publisher.pub -outform DER | sha256sum | cut -d ' ' -f1)"
            printf -- '- Controller source SHA-256: `%s`\n\n' "$(jq -r .controllerSHA256 "releases/$version.json")"
            printf '| Component | Version | Image |\n|---|---|---|\n'
            jq -r '.components|to_entries[]|"| \(.key) | \(.value.version) | `\(.value.image)` |"' "releases/$version.json"
            jq -r '.components.chattermost.initialization.image|"| chattermost-migrator | | `\(.)` |"' "releases/$version.json"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Hive $version" --notes-file notes.md \
            "releases/$version.json" "releases/$version.json.sig" trust/publisher.pub
