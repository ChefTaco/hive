name: Suite release

# Hive suite releases (2.0.0 and later), installed by hive.sh from a signed manifest.
# The legacy npm packages keep their v1.x tags and publish.yml; nothing here publishes to npm.
# 1. Run by hand from main with the suite version: builds, executes and publishes the
#    hive-registry and hive-ingress images at that exact version (linux/amd64 and
#    linux/arm64, provenance, SBOM and an attestation). An existing tag is never rebuilt.
# 2. Offline: build releases/VERSION.json from the published digests, sign it, commit it.
# 3. Push the tag vVERSION: verifies the signed manifest against the tagged controller and
#    the published suite images, then publishes the GitHub release. See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Suite release version (X.Y.Z, 2.0.0 or later)
        required: true
        type: string
      dry_run:
        description: Build and execute only; publish nothing
        type: boolean
        default: true
  push:
    tags: ['v*', '!v0.*', '!v1.*']

permissions:
  contents: read

concurrency:
  group: suite-release
  cancel-in-progress: false

jobs:
  images:
    name: Publish suite image (${{ matrix.component }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hive-registry
            context: services/hive-registry
            file: services/hive-registry/Dockerfile
            check: node /app/dist/cli.js --version
          - component: hive-ingress
            context: deployment
            file: deployment/ingress.Dockerfile
            check: caddy version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/cheftaco/${{ matrix.component }}
    steps:
      - name: Require an exact suite version from main
        run: |
          [[ "$VERSION" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] && (( BASH_REMATCH[1] >= 2 )) || { echo "::error::$VERSION is not a suite version (X.Y.Z, 2.0.0 or later)"; exit 1; }
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then echo "::error::Publish suite images from main"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable tag
        id: meta
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' 2>/dev/null); then
            echo "::notice::$IMAGE:$VERSION already exists ($digest); it is never rebuilt"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE@${digest//\"/} (existing)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and execute each architecture before publication
        if: steps.meta.outputs.exists == 'false'
        run: |
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" -f "${{ matrix.file }}" -t "suite-image-check:$arch" "${{ matrix.context }}"
            docker run --rm --platform "linux/$arch" --read-only --cap-drop ALL --security-opt no-new-privileges:true "suite-image-check:$arch" ${{ matrix.check }}
          done
      - name: Publish immutable image with provenance and SBOM
        id: build
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        if: env.DRY_RUN != 'true' && steps.meta.outputs.exists == 'false'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        if: env.DRY_RUN != 'true' && steps.meta.outputs.exists == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Verify and publish the signed release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the signed manifest against this controller
        run: bash scripts/release/check-suite-release.sh "${GITHUB_REF_NAME#v}"
      - name: Require the published suite images it pins
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pair in hive-registry:hive-registry ingress:hive-ingress; do
            component="${pair%%:*}" image="ghcr.io/cheftaco/${pair#*:}"
            published=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
            pinned=$(jq -r --arg name "$component" '.components[$name].image' "releases/$version.json")
            [[ "$pinned" == "$image@$published" ]] || { echo "::error::$component pins $pinned, but $image:$version is $published"; exit 1; }
          done
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "::error::Release $GITHUB_REF_NAME already exists"; exit 1; fi
          {
            awk -v heading="## $version" 'index($0, heading)==1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md
            printf '\n## Install\n\n```bash\ngit clone --branch %s https://github.com/%s.git hive && cd hive\n./hive.sh --release %s\n```\n\n' "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$version"
            printf 'The manifest, its signature and the publisher key are attached and also in the tagged tree.\n\n'
            printf -- '- Publisher key fingerprint (SHA-256 of the DER public key): `%s`\n' "$(openssl pkey -pubin -in trust/publisher.pub -outform DER | sha256sum | cut -d ' ' -f1)"
            printf -- '- Controller source SHA-256: `%s`\n\n' "$(jq -r .controllerSHA256 "releases/$version.json")"
            printf '| Component | Version | Image |\n|---|---|---|\n'
            jq -r '.components|to_entries[]|"| \(.key) | \(.value.version) | `\(.value.image)` |"' "releases/$version.json"
            jq -r '.components.chattermost.initialization.image|"| chattermost-migrator | | `\(.)` |"' "releases/$version.json"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Hive $version" --notes-file notes.md \
            "releases/$version.json" "releases/$version.json.sig" trust/publisher.pub
