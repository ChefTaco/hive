name: Hive CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hive-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - id: scope
        run: node scripts/ci-recovery-scope.mjs

  recovery:
    needs: recovery-scope
    # A failed/missing classifier must run the full suite and still leave CI failed.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/recovery.yml
    with:
      full: ${{ needs.recovery-scope.outputs.full != 'false' }}

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.3', '26.13.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure bounded authenticated package downloads
        run: sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh

      - name: Install repository check tools
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packages/hive-release/package-lock.json
            services/hive-router/package-lock.json
            services/hive-iam/package-lock.json
            services/hive-mem/ts-core/package-lock.json
            services/hive-skills/package-lock.json
            services/hive-registry/package-lock.json
            packages/hive/package-lock.json

      - name: Install bundled upgrade runtime build dependencies
        run: npm ci
        working-directory: packages/hive-release

      - name: Install router dependencies
        run: npm ci
        working-directory: services/hive-router

      - name: Install IAM dependencies
        run: npm ci
        working-directory: services/hive-iam

      - name: Verify IAM deployment lockfile
        run: npm ci --ignore-scripts --dry-run --workspaces=false
        working-directory: services/hive-iam/apps/iam-core

      - name: Install HiveMem TypeScript core dependencies
        run: npm ci
        working-directory: services/hive-mem/ts-core

      - name: Install Hive Skills dependencies
        run: npm ci
        working-directory: services/hive-skills

      - name: Install Hive Registry dependencies
        run: npm ci
        working-directory: services/hive-registry

      - name: Install launcher dependencies
        run: npm ci
        working-directory: packages/hive

      - name: Secret scan
        run: npm run scan:secrets

      - name: Private data check
        run: npm run check:private

      - name: Production dependency audit
        run: npm run audit:production

      - name: Shell and deploy artifact syntax
        run: npm run scripts:check && npm run tls:check

      - name: Doctor fails closed and reports deploy truth
        shell: bash
        run: |
          set -euo pipefail
          private_env="${RUNNER_TEMP}/hivemem.env"
          doctor_env="${RUNNER_TEMP}/hive.env"
          printf 'HIVEMEM_JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > "$private_env"
          printf '%s\n' \
            "HIVEMEM_ENV_FILE=$private_env" \
            'DEPLOY_USERNAME=ci' \
            'HIVE_DEPLOY_HOST=hive' \
            'HIVE_PUBLIC_FQDN=hive.example.com' \
            'HIVE_ROUTER_AUTH_MODE=os' \
            'HIVE_ROUTER_SECURITY_EXPORT_STATIC_FALLBACK_ENABLED=false' > "$doctor_env"
          chmod 600 "$private_env" "$doctor_env"
          npm run doctor -- --env-file "$doctor_env" --json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Canonical test, OpenAPI, migration, restore, and release gates
        run: npm run test

      - name: Ingress upstream keep-alive regression
        run: npm run test:suite:ingress-keepalive

      - name: Ingress routes, credential stripping and the Magnus host agent port
        if: matrix.node == '24.22.3'
        timeout-minutes: 10
        run: |
          latest=$(ls releases | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.json$' | sort -V | tail -n 1)
          export HIVE_INGRESS_TEST_IMAGE=$(jq -r .components.ingress.image "releases/$latest")
          export HIVEXUI_TEST_IMAGE=$(jq -r .components.hivexui.image "releases/$latest")
          npm run test:suite:ingress

      - name: Real Qdrant process recovery and bounded corpus drill
        timeout-minutes: 8
        env:
          HIVE_MEMORY_DRILL_REPORT: ${{ runner.temp }}/memory-recovery.json
        run: npm run test:memory-recovery

      - name: Memory recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-recovery-node${{ matrix.node }}
          path: ${{ runner.temp }}/memory-recovery.json
          if-no-files-found: warn

      - name: Setup Python integration environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: SDK and Hermes contracts
        run: |
          python -m pip install pytest httpx
          python scripts/hive-state-backup.test.py
          PYTHONPATH=services/hive-mem/sdks/python/src python -m pytest -q services/hive-mem/sdks/python/tests services/hive-mem/hermes-plugin/tests
          npm --prefix services/hive-mem/sdks/typescript ci
          npm --prefix services/hive-mem/sdks/typescript run build
          npm --prefix services/hive-mem/sdks/typescript test
          node --test scripts/hivemem-webhook-sdk.test.mjs

      - name: npm package contents (pack --dry-run of every publishable package)
        run: npm run check:packs

      - name: Fresh Skills package integration
        run: npm run check:skills-install

      - name: Install the packed servers with npm 12
        run: npm run check:npm12

      - name: Install browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
        working-directory: services/hive-router

      - name: Isolated console integration
        run: npm run test:e2e
        working-directory: services/hive-router

      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-node${{ matrix.node }}
          path: services/hive-router/test-results

  iam-docker:
    name: Server images and Compose recovery (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      HIVE_IMAGE_TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure bounded authenticated package downloads
        run: sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server util-linux openssl
      - run: npm run bootstrap
      - run: npm run build
      - run: node scripts/check-images.mjs
      - name: Existing IAM Compose example
        if: matrix.platform == 'linux/amd64'
        run: bash scripts/check-iam-compose.sh --no-build
      - name: Raw Compose pull/up, mixed images, missing supervisor and unhealthy recovery
        env:
          HIVE_UPGRADE_DRILL_COMPOSE: 'true'
        run: npm run check:upgrades

  upgrade-install:
    name: Public npm upgrade and restore (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.3', '26.13.1']
    steps:
      - uses: actions/checkout@v7
      - name: Configure bounded authenticated package downloads
        run: sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server util-linux openssl
      - run: npm run bootstrap
      - run: npm run build
      - name: Upgrade the current npm release to packed working tree and restore every store
        timeout-minutes: 20
        run: npm run check:upgrades
